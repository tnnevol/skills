name: Release Chandao CLI

# 触发条件：push tag 时自动执行（如 git tag chandao-cli/v1.0.0 && git push origin chandao-cli/v1.0.0）
# 也可手动触发（workflow_dispatch）用于重新发布
on:
  push:
    tags:
      - 'chandao-cli/v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: chandao-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: chandao-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: chandao-macos-arm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: chandao-win.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/chandao-cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        working-directory: apps/chandao-cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        working-directory: apps/chandao-cli
        run: cp target/${{ matrix.target }}/release/chandao${{ matrix.bin == 'chandao-win.exe' && '.exe' || '' }} ${{ matrix.bin }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}
          path: apps/chandao-cli/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        run: npm i -g pnpm@10.32.1

      - name: Install dependencies
        run: pnpm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: apps/chandao-cli/bin/

      - name: Flatten artifact directories
        working-directory: apps/chandao-cli/bin/
        run: |
          mv */* . 2>/dev/null || true
          rmdir * 2>/dev/null || true

      - name: Publish to npm
        working-directory: apps/chandao-cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
